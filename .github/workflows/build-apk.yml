name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe Build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'

jobs:
  build-apk:
    name: 📱 Build & Sign Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: |
          npm install

      - name: 🎨 Generate Web & App Icons from assets/logo.svg
        run: |
          node scripts/generate-icons.js

      - name: 🏗️ Build Web Assets (Vite Dist)
        run: |
          npm run build

      - name: ⚡ Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Menambahkan platform Android ke Capacitor..."
            npx cap add android
          fi
          
          # Generate icons directly into newly created android res folders
          echo "Menyinkronkan icon aplikasi Android dari logo.svg..."
          node scripts/generate-icons.js
          
          echo "Menyinkronkan web dist ke Android..."
          npx cap sync android

      - name: 🔐 Generate Automatic Signature Keystore
        id: generate_keystore
        run: |
          KEYSTORE_PATH="android/app/release.keystore"
          KEY_ALIAS="puasaku_key"
          KEY_PASS="puasaku123456"
          STORE_PASS="puasaku123456"

          echo "Membuat Signature Keystore otomatis..."
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=PUASAKU SRT 1 KEDIRI, OU=IT Department, O=Sekolah Rakyat 1 Kediri, L=Kediri, ST=Jawa Timur, C=ID"

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "✓ Keystore berhasil dibuat secara otomatis!"

      - name: ⚙️ Configure Gradle Signing for Release
        run: |
          GRADLE_FILE="android/app/build.gradle"
          
          # Inject signingConfigs into android/app/build.gradle
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("android/app/build.gradle", "utf8");
            
            const signingConfig = `
                signingConfigs {
                    release {
                        storeFile file("release.keystore")
                        storePassword "puasaku123456"
                        keyAlias "puasaku_key"
                        keyPassword "puasaku123456"
                    }
                }
            `;
            
            // Add signingConfigs inside android { ... }
            if (!content.includes("signingConfigs {")) {
              content = content.replace("android {", "android {" + signingConfig);
            }
            
            // Update buildTypes.release to use signingConfig
            content = content.replace(
              /buildTypes\s*{\s*release\s*{[^}]*}/s,
              `buildTypes {
                    release {
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                        signingConfig signingConfigs.release
                    }
                }`
            );
            
            fs.writeFileSync("android/app/build.gradle", content);
            console.log("✓ Gradle signing configuration updated!");
          '

      - name: 🔨 Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            echo "Building Signed Release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building Both Release and Debug APKs..."
            ./gradlew assembleRelease assembleDebug --stacktrace
          fi

      - name: 📋 Organize & Prepare Output APK Artifacts
        run: |
          mkdir -p build-output
          
          # Copy Release APK if exists
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/PUASAKU-SRT1Kediri-v1.0.0-Release-Signed.apk
            echo "✓ Release APK ready: build-output/PUASAKU-SRT1Kediri-v1.0.0-Release-Signed.apk"
          fi
          
          # Copy Debug APK if exists
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/PUASAKU-SRT1Kediri-v1.0.0-Debug.apk
            echo "✓ Debug APK ready: build-output/PUASAKU-SRT1Kediri-v1.0.0-Debug.apk"
          fi

      - name: 🚀 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Puasaku-Android-APK
          path: build-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Create GitHub Release (Optional on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## 📱 PUASAKU SRT 1 KEDIRI - Android APK Release
            
            Aplikasi resmi pencatatan dan verifikasi amalan puasa siswa SRT 1 Kediri.
            
            ### ✨ Fitur APK:
            - 🌟 Ikon aplikasi resmi sesuai `logo.svg`
            - 🔐 Otentikasi & Verifikasi Multi-Peran (Admin, Penginput, Pengecek)
            - 🔒 Penguncian Sesi & Deadline Input Puasa
            - 📴 Siap dipasang di semua perangkat Android (Android 5.0+)
            
            ### 📥 Unduh File:
            - **`PUASAKU-SRT1Kediri-v1.0.0-Release-Signed.apk`** (Versi Produksi Resmi)
          draft: false
          prerelease: false
